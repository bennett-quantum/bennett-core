[workspace]
members = ["crates/ir", "crates/exec", "crates/cli", "front/tests"]
# The front end's tests need LLVM and clang; `cargo test` alone stays fast and needs neither.
default-members = ["crates/ir", "crates/exec", "crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
bennett-ir = { path = "crates/ir" }
bennett-exec = { path = "crates/exec" }
clap = { version = "4.5", features = ["derive"] }
logos = "0.15"
num-complex = "0.4"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# The front end's tests run coherent regions over 2^16 branches: the executor is optimised even in test
# builds, which makes them several times faster and costs a few seconds of compilation.
[profile.dev.package.bennett-exec]
opt-level = 3
